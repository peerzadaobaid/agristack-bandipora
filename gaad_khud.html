<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaad Khud — Farmer ID Registration Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf9f5; --ink:#0f172a; --body:#334155; --muted:#64748b;
    --line:#e2e8f0; --line-strong:#cbd5e1;
    --navy:#1e3a5f; --navy-hover:#142a47;
    --forest:#14532d; --forest-soft:#f0fdf4; --forest-line:#86efac;
    --amber:#b45309; --amber-soft:#fffbeb; --amber-line:#fcd34d;
    --danger:#b91c1c;
    --font-display:'Fraunces','Georgia',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',Arial,sans-serif;
    --font-mono:ui-monospace,'SF Mono','Menlo','Monaco',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font-body); color:var(--body); background:var(--paper);
    line-height:1.5; font-size:16px; -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }

  /* ---------- HEADER ---------- */
  .topbar{background:var(--navy); color:#fff; padding:16px 24px}
  .topbar-inner{max-width:1280px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap}
  .topbar h1{font-family:var(--font-display); font-weight:500;
    font-size:22px; letter-spacing:-.01em; line-height:1.15}
  .topbar .sub{font-size:12.5px; opacity:.8; letter-spacing:.06em;
    text-transform:uppercase; margin-top:2px}
  .submitter-badge{background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22); padding:8px 14px;
    font-size:13.5px; line-height:1.35}
  .submitter-badge .lbl{font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; opacity:.75; display:block}
  .submitter-badge .nm{font-family:var(--font-display); font-size:15px;
    font-weight:500}

  /* ---------- STATS ---------- */
  .stats{background:#fff; border-bottom:1px solid var(--line); padding:16px 24px}
  .stats-inner{max-width:1280px; margin:0 auto;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:16px; align-items:center}
  .stat .label{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); font-weight:600}
  .stat .value{font-family:var(--font-display); font-size:24px;
    font-weight:500; color:var(--ink); line-height:1.1; margin-top:2px}
  .stat .value.issued{color:var(--forest)}
  .stat .value.pending{color:var(--amber)}
  .progress-wrap{grid-column:1/-1}
  .progress-bar{height:10px; background:var(--line); overflow:hidden}
  .progress-fill{height:100%; background:var(--forest); transition:width .3s}
  .progress-text{font-size:12.5px; color:var(--muted); margin-top:5px}

  /* ---------- TOOLBAR ---------- */
  .toolbar{background:#fff; border-bottom:1px solid var(--line); padding:12px 24px;
    position:sticky; top:0; z-index:20}
  .toolbar-inner{max-width:1280px; margin:0 auto;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .toolbar input[type=text]{flex:1; min-width:200px; padding:9px 12px;
    border:1px solid var(--line-strong); background:#fff;
    font-family:inherit; font-size:14px; color:var(--ink)}
  .toolbar input[type=text]:focus{outline:none; border-color:var(--navy);
    box-shadow:0 0 0 3px rgba(30,58,95,.1)}
  .toolbar select{padding:9px 12px; border:1px solid var(--line-strong);
    background:#fff; font-family:inherit; font-size:14px; color:var(--ink)}
  .dlbtn{margin-left:auto; padding:9px 15px; border:1px solid var(--line-strong);
    background:#fff; font-family:inherit; font-size:13.5px; font-weight:500;
    color:var(--body); cursor:pointer; white-space:nowrap; transition:all .12s}
  .dlbtn:hover:not(:disabled){border-color:var(--forest); color:var(--forest);
    background:var(--forest-soft)}
  .dlbtn:disabled{opacity:.55; cursor:wait}
  .save-state{margin-left:14px; font-size:12.5px; color:var(--muted);
    display:flex; align-items:center; gap:7px; white-space:nowrap}
  .save-state .dot{width:8px; height:8px; border-radius:50%;
    background:var(--line-strong); flex-shrink:0}
  .save-state.saving .dot{background:var(--amber); animation:pulse 1s infinite}
  .save-state.saved .dot{background:var(--forest)}
  .save-state.error .dot{background:var(--danger)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* ---------- TABLE ---------- */
  .table-wrap{max-width:1280px; margin:0 auto; padding:20px 24px}
  table{width:100%; background:#fff; border-collapse:collapse;
    border:1px solid var(--line); font-size:13.5px}
  thead th{background:var(--navy); color:#fff; padding:11px 10px;
    text-align:left; font-weight:600; white-space:nowrap;
    font-size:11px; text-transform:uppercase; letter-spacing:.06em}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr.done-issued{background:var(--forest-soft)}
  tbody tr.done-pending{background:var(--amber-soft)}
  tbody tr.open{background:#fff8ea}
  tbody td{padding:9px 10px; vertical-align:middle}
  td.sr{font-family:var(--font-mono); font-size:12px;
    color:var(--muted); text-align:right; width:52px}
  td.ref{font-family:var(--font-mono); font-size:12.5px; color:var(--body);
    white-space:nowrap; width:82px; text-align:center}

  /* landholder: name, parentage and type stacked, centred in the column */
  td.who{min-width:180px; text-align:center}
  thead th.who-h{text-align:center}
  .who .nm{font-weight:600; color:var(--ink); font-size:14px;
    line-height:1.25; display:block;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .who .meta{font-size:12px; color:var(--muted); line-height:1.3;
    margin-top:1px; display:flex; align-items:center;
    justify-content:center; gap:6px;
    overflow:hidden; white-space:nowrap}
  .who .par{overflow:hidden; text-overflow:ellipsis}
  .who .refs{display:none}
  .type-tag{font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    font-weight:700; padding:1px 5px; border:1px solid var(--line-strong);
    color:var(--muted); white-space:nowrap; flex-shrink:0}
  .type-tag.OWNER{border-color:var(--navy); color:var(--navy)}
  .type-tag.BOTH{border-color:var(--amber); color:var(--amber)}

  /* status column — the working area */
  td.act{width:390px}
  .act-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .seg{display:inline-flex; flex-shrink:0}
  .sbtn{padding:7px 17px; border:1px solid var(--line-strong);
    background:#fff; font-family:inherit; font-size:13px; font-weight:600;
    cursor:pointer; color:var(--muted); transition:all .12s}
  .sbtn+.sbtn{margin-left:-1px}
  .sbtn:hover{border-color:var(--navy); color:var(--navy); z-index:1; position:relative}
  .sbtn.on-issued{background:var(--forest); border-color:var(--forest); color:#fff}
  .sbtn.on-pending{background:var(--amber); border-color:var(--amber); color:#fff}
  .rbtn{border:1px solid var(--line-strong); background:#fff; cursor:pointer;
    color:var(--muted); font-family:inherit; font-size:15px; line-height:1;
    padding:6px 9px; transition:all .12s; flex-shrink:0}
  .rbtn:hover{border-color:var(--danger); color:var(--danger); background:#fef2f2}
  .reason-chip{font-size:11.5px; color:var(--amber);
    line-height:1.3; cursor:pointer; white-space:normal;
    flex:1; min-width:120px}
  .reason-chip:hover{text-decoration:underline}
  .reason-chip.missing{color:var(--danger); font-weight:600}

  /* expand row */
  tr.expand td{padding:0; background:#fffbef;
    border-bottom:2px solid var(--amber-line)}
  .expand-inner{padding:16px 18px; display:flex; gap:14px;
    align-items:flex-end; flex-wrap:wrap}
  .expand-inner .fld{display:flex; flex-direction:column; gap:5px; flex:1;
    min-width:240px}
  .expand-inner label{font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; font-weight:600; color:var(--muted)}
  .expand-inner select,.expand-inner input{padding:9px 11px;
    border:1px solid var(--line-strong); background:#fff;
    font-family:inherit; font-size:14px; color:var(--ink); width:100%}
  .expand-inner select:focus,.expand-inner input:focus{outline:none;
    border-color:var(--amber); box-shadow:0 0 0 3px rgba(180,83,9,.1)}
  .btn{padding:9px 18px; border:none; background:var(--forest); color:#fff;
    font-family:inherit; font-size:14px; font-weight:500; cursor:pointer}
  .btn:hover{background:#0f3e21}
  .btn.ghost{background:#fff; color:var(--body); border:1px solid var(--line-strong)}
  .btn.ghost:hover{background:#f8fafc; color:var(--ink)}

  /* ---------- PAGINATION ---------- */
  .pager{max-width:1280px; margin:0 auto; padding:4px 24px 24px;
    display:flex; gap:6px; align-items:center; justify-content:center;
    flex-wrap:wrap}
  .pager button{padding:7px 13px; border:1px solid var(--line-strong);
    background:#fff; font-family:inherit; font-size:13px; cursor:pointer;
    color:var(--body)}
  .pager button:hover:not(:disabled){background:#f8fafc; border-color:var(--navy)}
  .pager button.active{background:var(--navy); color:#fff; border-color:var(--navy)}
  .pager button:disabled{opacity:.35; cursor:not-allowed}
  .pager .info{font-size:12.5px; color:var(--muted); margin-left:10px}

  /* ---------- MISC ---------- */
  .empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:14px}
  .banner{max-width:1280px; margin:16px auto 0; padding:14px 18px;
    border-left:3px solid; font-size:14px}
  .banner.err{background:#fef2f2; border-color:var(--danger); color:#7f1d1d}
  .banner.warn{background:var(--amber-soft); border-color:var(--amber); color:#78350f}
  .loading{padding:60px 20px; text-align:center; color:var(--muted)}
  .spinner{display:inline-block; width:22px; height:22px;
    border:3px solid var(--line); border-top-color:var(--navy);
    border-radius:50%; animation:spin .8s linear infinite;
    vertical-align:middle; margin-right:10px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed; bottom:22px; right:22px; padding:12px 20px;
    background:var(--ink); color:#fff; font-size:14px; z-index:200;
    opacity:0; transform:translateY(14px);
    transition:opacity .22s,transform .22s;
    box-shadow:0 6px 24px rgba(0,0,0,.2)}
  .toast.show{opacity:1; transform:translateY(0)}
  .toast.err{background:var(--danger)}
  footer{max-width:1280px; margin:0 auto; padding:24px;
    text-align:center; font-size:12px; color:var(--muted);
    border-top:1px solid var(--line)}
  footer .office{font-family:var(--font-display); font-style:italic;
    font-size:13px; color:var(--body)}

  @media(max-width:900px){
    td.act{width:330px}
    .sbtn{padding:7px 13px}
  }

  /* ---------- MOBILE: rows become cards ---------- */
  @media(max-width:720px){
    .topbar,.stats,.toolbar,.pager{padding-left:14px; padding-right:14px}
    .table-wrap{padding:14px}
    .stat .value{font-size:20px}
    .toolbar input[type=text]{min-width:0; flex-basis:100%}
    .save-state{margin-left:0}
    .dlbtn{margin-left:0; flex:1}

    table{border:none; background:transparent; font-size:14px}
    thead{display:none}
    tbody{display:block}
    tbody tr{display:block; background:#fff; border:1px solid var(--line);
      margin-bottom:10px; padding:13px 14px}
    tbody tr.done-issued{border-left:4px solid var(--forest)}
    tbody tr.done-pending{border-left:4px solid var(--amber)}
    tbody tr.open{border-left:4px solid var(--amber)}
    tbody td{display:block; padding:0; border:none}

    td.sr,td.ref{display:none}
    td.who{min-width:0; max-width:none; text-align:left}
    .who .meta{justify-content:flex-start}
    .who .nm{font-size:16px; white-space:normal}
    .who .meta{font-size:13px; white-space:normal; margin-top:3px}
    .who .par{overflow:visible}
    .who .refs{display:block; font-family:var(--font-mono);
      font-size:11px; color:var(--muted); margin-top:6px;
      letter-spacing:.02em}

    td.act{width:auto; margin-top:12px}
    .act-row{gap:8px}
    .seg{flex:1; display:flex}
    .sbtn{flex:1; text-align:center; padding:11px 6px; font-size:13.5px}
    .rbtn{padding:10px 13px; font-size:16px}
    .reason-chip{flex-basis:100%; min-width:0; font-size:12.5px; margin-top:2px}

    tr.expand{margin-top:-10px; border-top:none; padding:0}
    tr.expand td{background:#fffbef}
    .expand-inner{padding:14px; gap:12px}
    .expand-inner .fld{min-width:0; flex-basis:100%}
    .expand-inner .btn{flex:1}

    .empty{padding:30px 14px}
    .pager button{padding:8px 12px}
    .pager .info{flex-basis:100%; text-align:center; margin:6px 0 0}
  }

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div>
      <h1>Gaad Khud</h1>
      <div class="sub">Farmer ID Registration Tracking · Tehsil SUMBAL</div>
    </div>
    <div class="submitter-badge" id="submitter-badge">
      <span class="lbl">Data submitted by</span>
      <span class="nm" id="submitter-name">…</span>
    </div>
  </div>
</div>

<div id="boot" class="loading"><span class="spinner"></span>Loading village data…</div>

<div id="app" style="display:none">

  <div class="stats">
    <div class="stats-inner">
      <div class="stat"><div class="label">Total</div>
        <div class="value" id="s-total">0</div></div>
      <div class="stat"><div class="label">Issued</div>
        <div class="value issued" id="s-issued">0</div></div>
      <div class="stat"><div class="label">Pending</div>
        <div class="value pending" id="s-pending">0</div></div>
      <div class="stat"><div class="label">Not yet done</div>
        <div class="value" id="s-remaining">0</div></div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="s-fill" style="width:0%"></div></div>
        <div class="progress-text" id="s-text">0% complete</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-inner">
      <input type="text" id="q" placeholder="Search by name, parentage, khasra, khata or S.No…">
      <select id="filter">
        <option value="all">All records</option>
        <option value="remaining">Not yet done</option>
        <option value="issued">Issued</option>
        <option value="pending">Pending</option>
        <option value="noreason">Pending — reason missing</option>
      </select>
      <select id="psize">
        <option value="50">50 per page</option>
        <option value="100">100 per page</option>
        <option value="200">200 per page</option>
      </select>
      <button class="dlbtn" id="dl" onclick="downloadExcel()" title="Download all records with the entries made so far">
        <span id="dl-text">Download Excel</span>
      </button>
      <div class="save-state" id="save-state"><span class="dot"></span><span id="save-text">All saved</span></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>S.No</th>
          <th class="hide-sm">Khewat</th>
          <th class="hide-sm">Khata</th>
          <th class="hide-sm">Khasra</th>
          <th class="who-h">Landholder</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </div>

  <footer>
    <div class="office">Developed and maintained by Obaid Peerzada</div>
  </footer>
</div>

<div class="toast" id="toast"></div>

let REASONS = [];
let submitter = '';
const state = {};          // sr -> {status, reason, reason_detail, submitted_by, submitted_at}
let page = 1;
let view = [];
let openSr = null;

const queue = new Map();   // sr -> payload waiting to be sent
let flushTimer = null;
let inFlight = false;

// ---------- BOOT ----------
(async function boot(){
  try{
    const cfg = await api({ action:'getConfig', village: VILLAGE });
    if(!cfg.ok){ bootFail(cfg.error); return; }
    submitter = cfg.submitter || '';
    REASONS = cfg.reasons || [];
    document.getElementById('submitter-name').textContent = submitter || 'Not assigned';
    if(!submitter){
      banner('warn','No submitter has been assigned to this village yet. '+
        'Entries will be recorded as "Unassigned" until an administrator sets a name.');
    }

    const st = await api({ action:'fetchStatus', village: VILLAGE });
    if(st.ok && st.filled){
      Object.keys(st.filled).forEach(k => { state[parseInt(k,10)] = st.filled[k]; });
    }

    document.getElementById('boot').style.display='none';
    document.getElementById('app').style.display='block';
    bind();
    refresh();
  }catch(e){
    console.error(e);
    bootFail('Could not reach the server. Check your connection and reload.');
  }
})();

function bootFail(msg){
  document.getElementById('boot').innerHTML =
    '<div class="banner err" style="text-align:left">'+esc(msg)+'</div>';
}

function banner(kind,msg){
  const d=document.createElement('div');
  d.className='banner '+kind; d.textContent=msg;
  document.getElementById('app').prepend(d);
}

// ---------- RENDER ----------
function refresh(){ applyFilter(); stats(); table(); pager(); }

function stats(){
  const total=RECORDS.length;
  let issued=0,pending=0;
  Object.values(state).forEach(v=>{
    if(v.status==='Issued') issued++;
    else if(v.status==='Pending') pending++;
  });
  const done=issued+pending;
  const pct=total?Math.round(done/total*100):0;
  set('s-total',total); set('s-issued',issued); set('s-pending',pending);
  set('s-remaining',total-done);
  document.getElementById('s-fill').style.width=pct+'%';
  document.getElementById('s-text').textContent=
    pct+'% complete — '+done.toLocaleString('en-IN')+' of '+total.toLocaleString('en-IN')+' recorded';
}

function applyFilter(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const f=document.getElementById('filter').value;
  view=RECORDS.filter(r=>{
    const s=state[r.sr];
    if(f==='remaining' && s) return false;
    if(f==='issued' && (!s||s.status!=='Issued')) return false;
    if(f==='pending' && (!s||s.status!=='Pending')) return false;
    if(f==='noreason' && (!s||s.status!=='Pending'||s.reason)) return false;
    if(q){
      const hay=(r.sr+' '+r.khewat+' '+r.khata+' '+r.khasra+' '+r.name+' '+r.parentage).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const maxPage=Math.max(1,Math.ceil(view.length/psize()));
  if(page>maxPage) page=maxPage;
}

function psize(){ return parseInt(document.getElementById('psize').value,10); }

function table(){
  const tb=document.getElementById('tb');
  const start=(page-1)*psize();
  const rows=view.slice(start,start+psize());
  if(!rows.length){
    tb.innerHTML='<tr><td colspan="6" class="empty">No records match.</td></tr>';
    return;
  }
  let html='';
  rows.forEach(r=>{
    const s=state[r.sr];
    const st=s?s.status:'';
    const cls = st==='Issued'?'done-issued' : st==='Pending'?'done-pending' : '';
    const isOpen = openSr===r.sr;

    let chip='';
    if(st==='Pending'){
      if(s.reason){
        const txt = s.reason==='Other' ? s.reason_detail : s.reason;
        chip='<span class="reason-chip" onclick="openRow('+r.sr+')">'+esc(txt)+' &#9998;</span>';
      }else{
        chip='<span class="reason-chip missing" onclick="openRow('+r.sr+')">Reason needed &#9998;</span>';
      }
    }

    const reset = st
      ? '<button class="rbtn" title="Clear this entry" onclick="resetRow('+r.sr+')">&#10005;</button>'
      : '';

    html+='<tr class="'+(isOpen?'open':cls)+'">'+
      '<td class="sr">'+r.sr+'</td>'+
      '<td class="ref hide-sm">'+esc(r.khewat)+'</td>'+
      '<td class="ref hide-sm">'+esc(r.khata)+'</td>'+
      '<td class="ref hide-sm">'+esc(r.khasra)+'</td>'+
      '<td class="who">'+
        '<span class="nm" title="'+esc(r.name)+'">'+esc(r.name)+'</span>'+
        '<span class="meta">'+
          '<span class="par" title="'+esc(r.parentage)+'">'+esc(r.parentage)+'</span>'+
          '<span class="type-tag '+esc(r.type)+'">'+esc(r.type)+'</span>'+
        '</span>'+
        '<span class="refs">#'+r.sr+' &nbsp;·&nbsp; Khewat '+esc(r.khewat)+
          ' &nbsp;·&nbsp; Khata '+esc(r.khata)+' &nbsp;·&nbsp; Khasra '+esc(r.khasra)+'</span>'+
      '</td>'+
      '<td class="act"><div class="act-row">'+
        '<span class="seg">'+
          '<button class="sbtn'+(st==='Issued'?' on-issued':'')+'" onclick="setIssued('+r.sr+')">Issued</button>'+
          '<button class="sbtn'+(st==='Pending'?' on-pending':'')+'" onclick="openRow('+r.sr+')">Pending</button>'+
        '</span>'+
        reset+chip+
      '</div></td></tr>';

    if(isOpen) html+=expandRow(r);
  });
  tb.innerHTML=html;

  if(openSr!==null){
    const sel=document.getElementById('rsel');
    if(sel) sel.focus();
  }
}

function expandRow(r){
  const s=state[r.sr]||{};
  const cur=s.status==='Pending'?(s.reason||''):'';
  const det=s.reason_detail||'';
  let opts='<option value="">— select a reason —</option>';
  REASONS.forEach(x=>{
    opts+='<option value="'+esc(x)+'"'+(x===cur?' selected':'')+'>'+esc(x)+'</option>';
  });
  opts+='<option value="Other"'+(cur==='Other'?' selected':'')+'>Other (type below)</option>';

  return '<tr class="expand"><td colspan="6"><div class="expand-inner">'+
    '<div class="fld"><label>Reason for the pendency</label>'+
      '<select id="rsel" onchange="onReasonChange('+r.sr+')">'+opts+'</select></div>'+
    '<div class="fld" id="rdet-wrap" style="'+(cur==='Other'?'':'display:none')+'">'+
      '<label>Please specify</label>'+
      '<input type="text" id="rdet" maxlength="200" value="'+esc(det)+'" '+
      'placeholder="Describe the reason" onkeydown="if(event.key===\'Enter\')savePending('+r.sr+')"></div>'+
    '<button class="btn" onclick="savePending('+r.sr+')">Save</button>'+
    '<button class="btn ghost" onclick="closeRow()">Cancel</button>'+
    '</div></td></tr>';
}

function pager(){
  const total=Math.max(1,Math.ceil(view.length/psize()));
  const c=document.getElementById('pager'); c.innerHTML='';
  const mk=(t,p,dis,act)=>{
    const b=document.createElement('button');
    b.textContent=t; b.disabled=!!dis;
    if(act) b.classList.add('active');
    b.onclick=()=>{ page=p; closeRow(); table(); pager();
      window.scrollTo({top:0,behavior:'smooth'}); };
    return b;
  };
  c.appendChild(mk('‹ Prev',page-1,page===1));
  const from=Math.max(1,page-2), to=Math.min(total,page+2);
  if(from>1){ c.appendChild(mk('1',1,false,false));
    if(from>2){ const s=document.createElement('span');
      s.textContent='…'; s.style.color='var(--muted)'; c.appendChild(s);} }
  for(let p=from;p<=to;p++) c.appendChild(mk(String(p),p,false,p===page));
  if(to<total){ if(to<total-1){ const s=document.createElement('span');
      s.textContent='…'; s.style.color='var(--muted)'; c.appendChild(s);}
    c.appendChild(mk(String(total),total,false,false)); }
  c.appendChild(mk('Next ›',page+1,page===total));
  const i=document.createElement('span'); i.className='info';
  i.textContent='Page '+page+' of '+total+' · '+view.length.toLocaleString('en-IN')+' record(s)';
  c.appendChild(i);
}

// ---------- ACTIONS ----------
function setIssued(sr){
  closeRow();
  const prev=state[sr];
  if(prev && prev.status==='Issued'){ return; }   // already issued, no-op
  state[sr]={status:'Issued',reason:'',reason_detail:'',
             submitted_by:submitter,submitted_at:new Date().toISOString()};
  enqueue(sr,{sr_no:sr,status:'Issued',reason:'',reason_detail:''},prev);
  refresh();
}

function resetRow(sr){
  if(!state[sr]) return;
  closeRow();
  const prev=state[sr];
  delete state[sr];
  enqueue(sr,{sr_no:sr,status:'',reason:'',reason_detail:''},prev);
  refresh();
  toast('Sr. No. '+sr+' cleared.');
}

function openRow(sr){
  openSr=sr;
  applyFilter();
  // make sure the row is on the current page
  const idx=view.findIndex(r=>r.sr===sr);
  if(idx>=0) page=Math.floor(idx/psize())+1;
  table(); pager();
}

function closeRow(){ if(openSr!==null){ openSr=null; table(); } }

function onReasonChange(sr){
  const v=document.getElementById('rsel').value;
  const w=document.getElementById('rdet-wrap');
  if(v==='Other'){ w.style.display=''; document.getElementById('rdet').focus(); }
  else w.style.display='none';
}

function savePending(sr){
  const reason=document.getElementById('rsel').value;
  const detail=(document.getElementById('rdet')||{}).value||'';
  if(!reason){ toast('Pick a reason first.',true); return; }
  if(reason==='Other' && !detail.trim()){
    toast('Describe the reason in the box.',true); return; }

  const prev=state[sr];
  state[sr]={status:'Pending',reason:reason,reason_detail:detail.trim(),
             submitted_by:submitter,submitted_at:new Date().toISOString()};
  enqueue(sr,{sr_no:sr,status:'Pending',reason:reason,reason_detail:detail.trim()},prev);
  openSr=null;
  refresh();
}

// ---------- SAVE QUEUE ----------
function enqueue(sr,payload,prev){
  queue.set(sr,{payload:payload,prev:prev});
  saveState('saving',queue.size+' to save…');
  if(flushTimer) clearTimeout(flushTimer);
  if(queue.size>=25) flush();
  else flushTimer=setTimeout(flush,1200);
}

async function flush(){
  if(inFlight || !queue.size) return;
  inFlight=true;
  if(flushTimer){ clearTimeout(flushTimer); flushTimer=null; }

  const batch=Array.from(queue.entries());
  const rows=batch.map(([,v])=>v.payload);
  saveState('saving','Saving '+rows.length+'…');

  try{
    const res=await api({action:'save', village:VILLAGE, rows:rows});
    if(!res.ok) throw new Error(res.error||'Save rejected');

    const saved=new Set((res.saved||[]).map(Number));
    batch.forEach(([sr,v])=>{
      if(saved.has(sr)){
        queue.delete(sr);
        if(state[sr]) state[sr].submitted_by=res.submitter||submitter;
      }else{
        // server refused this row — roll it back
        queue.delete(sr);
        if(v.prev) state[sr]=v.prev; else delete state[sr];
      }
    });

    const refused=res.skipped||[];
    if(refused.length){
      const first=refused[0];
      const why=(first && first.why) ? first.why : '';
      const sr=(first && first.sr_no!==undefined) ? first.sr_no : first;
      toast(refused.length===1
        ? ('Sr. No. '+sr+' not saved'+(why?' — '+why:''))
        : (refused.length+' entries not saved'+(why?' — '+why:'')), true);
      console.warn('Refused rows:', refused);
    }

    saveState(queue.size?'saving':'saved', queue.size? queue.size+' to save…':'All saved');
    refresh();
  }catch(e){
    console.error(e);
    saveState('error','Save failed — retrying…');
    inFlight=false;
    flushTimer=setTimeout(flush,4000);   // retry
    return;
  }
  inFlight=false;
  if(queue.size) flushTimer=setTimeout(flush,400);
}

function saveState(kind,text){
  const el=document.getElementById('save-state');
  el.className='save-state '+kind;
  document.getElementById('save-text').textContent=text;
}

window.addEventListener('beforeunload',e=>{
  if(queue.size){ e.preventDefault(); e.returnValue=''; }
});

let sheetJsReady = null;
function loadSheetJs(){
  if(sheetJsReady) return sheetJsReady;
  sheetJsReady = new Promise((resolve,reject)=>{
    if(window.XLSX) return resolve();
    const el=document.createElement('script');
    el.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    el.onload=()=>resolve();
    el.onerror=()=>reject(new Error('Could not load the Excel library'));
    document.head.appendChild(el);
  });
  return sheetJsReady;
}

async function downloadExcel(){
  const btn=document.getElementById('dl');
  const lbl=document.getElementById('dl-text');
  btn.disabled=true; lbl.textContent='Preparing…';
  try{
    if(queue.size){ await flush(); }        // don't export stale work
    await loadSheetJs();

    // pull the latest from the sheet so other devices' entries are included
    lbl.textContent='Fetching…';
    try{
      const st=await api({action:'fetchStatus', village:VILLAGE});
      if(st.ok && st.filled){
        Object.keys(state).forEach(k=>delete state[k]);
        Object.keys(st.filled).forEach(k=>{ state[parseInt(k,10)]=st.filled[k]; });
        refresh();
      }
    }catch(e){ console.warn('Live refresh failed, exporting local view', e); }

    lbl.textContent='Building…';
    const head=['S.NO.','KHEWAT','KHATA','KHASRA','NAME','PARENTAGE','TYPE',
                'STATUS','REASON','REASON DETAIL','SUBMITTED BY','SUBMITTED AT'];
    const rows=[head];
    RECORDS.forEach(r=>{
      const s=state[r.sr]||{};
      rows.push([r.sr, r.khewat, r.khata, r.khasra, r.name, r.parentage, r.type,
        s.status||'', s.reason||'', s.reason_detail||'',
        s.submitted_by||'', s.submitted_at? fmtStamp(s.submitted_at):'']);
    });

    let issued=0,pending=0;
    Object.values(state).forEach(v=>{ if(v.status==='Issued')issued++;
                                      else if(v.status==='Pending')pending++; });
    const done=issued+pending;

    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:7},{wch:9},{wch:9},{wch:11},{wch:24},{wch:20},{wch:12},
                 {wch:11},{wch:38},{wch:32},{wch:22},{wch:20}];
    ws['!freeze']={xSplit:1,ySplit:1};
    XLSX.utils.book_append_sheet(wb,ws,VILLAGE.substring(0,31));

    const sum=[
      ['Farmer ID Registration Tracking'],
      ['Village', VILLAGE],
      ['Tehsil', TEHSIL],
      ['Exported', new Date().toLocaleString('en-IN')],
      [],
      ['Total records', RECORDS.length],
      ['Issued', issued],
      ['Pending', pending],
      ['Not yet done', RECORDS.length-done],
      ['Progress', (RECORDS.length? Math.round(done/RECORDS.length*100):0)+'%'],
      [],
      ['Pending — by reason']
    ];
    const byReason={};
    Object.values(state).forEach(v=>{
      if(v.status!=='Pending') return;
      const k=v.reason==='Other' ? 'Other' : (v.reason||'(no reason given)');
      byReason[k]=(byReason[k]||0)+1;
    });
    Object.keys(byReason).sort((a,b)=>byReason[b]-byReason[a])
      .forEach(k=>sum.push([k, byReason[k]]));
    if(!Object.keys(byReason).length) sum.push(['(none yet)','']);

    const ws2=XLSX.utils.aoa_to_sheet(sum);
    ws2['!cols']=[{wch:42},{wch:26}];
    XLSX.utils.book_append_sheet(wb,ws2,'Summary');

    const stamp=new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb,'FarmerID_'+VILLAGE.replace(/[^A-Za-z0-9]+/g,'_')+'_'+stamp+'.xlsx');
    toast('Excel downloaded — '+done+' of '+RECORDS.length+' recorded.');
  }catch(e){
    console.error(e);
    toast('Download failed: '+e.message,true);
  }finally{
    btn.disabled=false; lbl.textContent='Download Excel';
  }
}

function fmtStamp(iso){
  try{ return new Date(iso).toLocaleString('en-IN'); }catch(e){ return iso; }
}

// ---------- API ----------
async function api(payload){
  const res=await fetch(APPS_SCRIPT_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    redirect:'follow'
  });
  return await res.json();
}

// ---------- UTIL ----------
function bind(){
  document.getElementById('q').addEventListener('input',()=>{page=1;closeRow();refresh();});
  document.getElementById('filter').addEventListener('change',()=>{page=1;closeRow();refresh();});
  document.getElementById('psize').addEventListener('change',()=>{page=1;closeRow();refresh();});
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeRow(); });
}
function set(id,v){ document.getElementById(id).textContent=(v||0).toLocaleString('en-IN'); }
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let toastT=null;
function toast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('err',!!isErr); t.classList.add('show');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
