services:
  - type: web
    name: agristack-bandipora
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120 --max-requests 200 --max-requests-jitter 20
    envVars:
      - key: DOWNLOAD_PASSWORD
        sync: false
